name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dedektör, paket ve eval testleri
        run: python scripts/run_tests.py --no-report

      - name: dist/ ve skills/ senkronizasyonu (build_dist unutulmasın)
        run: |
          python scripts/build_dist.py
          git diff --exit-code
